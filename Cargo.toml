[package]
name = "buildd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Coordinates the Cargo builds of many concurrent sessions: fixed build slots, tree snapshots, one CPU budget"
publish = false

[dependencies]
crossbeam-channel = "0.5.16"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[features]
default = ["cli"]
# The `buildd` command. Programs that only use the library (the client, the
# protocol) turn default features off and leave out the terminal UI that
# `top` draws with.
cli = ["dep:ratatui"]

[[bin]]
name = "buildd"
path = "src/main.rs"
required-features = ["cli"]

# A violated invariant in the daemon stops it outright instead of leaving a
# build or slot stuck behind a dead thread. Tests ignore this setting.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
