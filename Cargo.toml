[package]
name = "buildd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Coordinates the Cargo builds of many concurrent sessions: fixed build slots, tree snapshots, one CPU budget"
publish = false

[dependencies]
crossbeam-channel = "0.5.16"
directories = "6"
jobserver = "0.1.34"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

# A violated invariant in the daemon stops it outright instead of leaving a
# build or slot stuck behind a dead thread. Tests ignore this setting.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
